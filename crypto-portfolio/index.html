<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Portfolio Tracker</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#21262d; --txt:#e6edf3; --sub:#8b949e; --green:#3fb950; --red:#f85149; --accent:#8b5cf6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; padding:24px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:1.4rem; margin-bottom:4px; }
  .sub { color:var(--sub); font-size:.85rem; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .field { flex:1; min-width:120px; }
  .field label { display:block; font-size:.75rem; color:var(--sub); margin-bottom:4px; }
  input { width:100%; background:#0d1117; border:1px solid var(--line); border-radius:8px; color:var(--txt); padding:10px; font-size:.95rem; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:.9rem; cursor:pointer; font-weight:600; }
  button:hover { opacity:.9; }
  .total { font-size:1.5rem; font-weight:700; margin-top:4px; }
  .total-label { color:var(--sub); font-size:.8rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:right; padding:10px 8px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--sub); font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; }
  .pos { color:var(--green); }
  .neg { color:var(--red); }
  .del { background:transparent; border:1px solid var(--line); color:var(--sub); padding:4px 8px; font-size:.8rem; }
  .empty { color:var(--sub); text-align:center; padding:24px 0; font-size:.9rem; }
  .sym { font-weight:700; text-transform:uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 Crypto Portfolio</h1>
  <div class="sub">Harga live dari Binance · data tersimpan di perangkat kamu</div>

  <div class="card">
    <div class="row">
      <div class="field"><label>Coin (contoh: BTC, ETH, SOL)</label><input id="coin" placeholder="BTC"></div>
      <div class="field"><label>Jumlah</label><input id="amount" type="number" step="any" placeholder="0.5"></div>
      <div class="field"><label>Harga beli (opsional)</label><input id="buy" type="number" step="any" placeholder="kosongkan"></div>
      <div class="field" style="align-self:flex-end"><button id="add">+ Tambah</button></div>
    </div>
  </div>

  <div class="card">
    <div class="total-label">Total nilai portofolio</div>
    <div class="total" id="total">Rp — / $0.00</div>
  </div>

  <div class="card" id="listCard">
    <div id="list"></div>
  </div>
</div>

<script>
const LS_KEY = "crypto_portfolio_v1";
let holdings = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
let prices = {};

function save() { localStorage.setItem(LS_KEY, JSON.stringify(holdings)); }

function fmtUSD(n) {
  if (n == null || isNaN(n)) return "—";
  const opts = { maximumFractionDigits: n < 1 ? 4 : 2 };
  return "$" + n.toLocaleString("en-US", opts);
}
function fmtIDR(n) {
  if (n == null || isNaN(n)) return "Rp —";
  return "Rp" + Math.round(n).toLocaleString("id-ID");
}

// USDT price via Binance; assume USDT≈$1 (and ≈Rp15,000 for IDR display)
const IDR = 15000;
async function fetchPrice(sym) {
  try {
    const r = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}USDT`);
    const d = await r.json();
    return parseFloat(d.price);
  } catch { return null; }
}

async function refresh() {
  const syms = [...new Set(holdings.map(h => h.coin))];
  await Promise.all(syms.map(async s => { prices[s] = await fetchPrice(s); }));
  render();
}

function render() {
  const listEl = document.getElementById("list");
  if (!holdings.length) {
    listEl.innerHTML = `<div class="empty">Belum ada aset. Tambahkan coin di atas 👆</div>`;
  } else {
    let rows = "";
    for (const h of holdings) {
      const p = prices[h.coin];
      const value = p != null ? p * h.amount : null;
      let pnl = "", pnlClass = "";
      if (h.buy != null && value != null) {
        const cost = h.buy * h.amount;
        const diff = value - cost;
        const pct = cost ? (diff / cost) * 100 : 0;
        pnl = `${diff >= 0 ? "+" : ""}${fmtUSD(diff)} (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%)`;
        pnlClass = diff >= 0 ? "pos" : "neg";
      }
      rows += `<tr>
        <td><span class="sym">${h.coin}</span></td>
        <td>${h.amount}</td>
        <td>${fmtUSD(p)}</td>
        <td>${fmtUSD(value)}</td>
        <td class="${pnlClass}">${pnl || "—"}</td>
        <td><button class="del" data-idx="${holdings.indexOf(h)}">✕</button></td>
      </tr>`;
    }
    listEl.innerHTML = `<table>
      <thead><tr><th>Coin</th><th>Jumlah</th><th>Harga</th><th>Nilai</th><th>P/L</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
  const totalUSD = holdings.reduce((s, h) => s + (prices[h.coin] != null ? prices[h.coin] * h.amount : 0), 0);
  document.getElementById("total").textContent = `${fmtIDR(totalUSD * IDR)} / ${fmtUSD(totalUSD)}`;
}

document.getElementById("add").onclick = () => {
  const coin = document.getElementById("coin").value.trim().toUpperCase().replace(/USDT$/, "");
  const amount = parseFloat(document.getElementById("amount").value);
  if (!coin || !amount) { alert("Isi coin dan jumlah dulu"); return; }
  const buyRaw = document.getElementById("buy").value;
  const buy = buyRaw ? parseFloat(buyRaw) : null;
  holdings.push({ coin, amount, buy });
  save(); refresh();
  document.getElementById("coin").value = ""; document.getElementById("amount").value = ""; document.getElementById("buy").value = "";
};

document.addEventListener("click", e => {
  if (e.target.classList.contains("del")) {
    holdings.splice(parseInt(e.target.dataset.idx), 1);
    save(); refresh();
  }
});

refresh();
</script>
</body>
</html>
