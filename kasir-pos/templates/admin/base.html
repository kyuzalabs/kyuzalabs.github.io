{% extends "base.html" %}
{% block content %}
<div class="admin-layout">
  <aside class="sidebar">
    <a href="/admin" class="side-link {{ 'active' if request.endpoint == 'admin' }}">📊 Dashboard</a>
    <a href="/admin/menu" class="side-link {{ 'active' if request.endpoint == 'admin_menu' }}">🍽️ Menu</a>
    <a href="/admin/tables" class="side-link {{ 'active' if request.endpoint == 'admin_tables' }}">🪑 Meja</a>
    <a href="/admin/orders" class="side-link {{ 'active' if request.endpoint == 'admin_orders' }}">🧾 Pesanan</a>
    <a href="/kasir" class="side-link">🛒 ← Kasir</a>
  </aside>
  <div class="admin-main">
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
