{% extends "admin/base.html" %}
{% block admin_content %}
<h1 class="page-title">🪑 Kelola Meja</h1>

<div class="card mt-16">
  <h3 class="panel-title">Tambah Meja</h3>
  <form method="POST" action="/admin/tables/add" class="add-row">
    <input class="input" name="name" placeholder="Nama meja (mis. Meja 7)" required>
    <button class="btn btn-primary">Tambah Meja</button>
  </form>
</div>

<div class="table-wrap mt-16">
  <table class="table">
    <tr><th>Meja</th><th>Status</th></tr>
    {% for t in tables %}
    <tr>
      <td>{{ t.name }}</td>
      <td><span class="badge {{ 'paid' if t.status == 'busy' else 'cancelled' }}">{{ 'Terpakai' if t.status == 'busy' else 'Kosong' }}</span></td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
